services:
  postgres:
    image: postgres:15
    container_name: studyhour-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: studyhour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
